# Project-wide Gradle settings.
# The HEAP SIZE IS REQUIRED BY THE PROJECT SPEC: -Xmx2g.
#
# Do NOT add -Dfile.encoding=UTF-8 to org.gradle.jvmargs here.
# Gradle writes the test-worker classpath as an @argfile using the daemon's
# default charset, but the JVM launcher reads @argfiles with the *native*
# encoding (GBK on this zh-CN Windows box). Forcing UTF-8 makes the two
# disagree and every unit-test worker dies immediately with
# "ClassNotFoundException: worker.org.gradle.process.internal.worker.GradleWorkerMain"
# (gradle/gradle#30304, fixed only in Gradle 9.x). Leaving file.encoding unset
# keeps the writer and the reader on the same native encoding, and the console
# output is native-encoded anyway.
org.gradle.jvmargs=-Xmx2g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# The project lives under C:\Users\<non-ASCII user name>\..., which trips AGP's
# "project path contains non-ASCII characters" guard (b.android.com/95744).
# This is AGP's own documented escape hatch; without it the build stops with
# StopExecutionException before any task runs.
android.overridePathCheck=true

# AndroidX + Jetifier-free (Jetifier is not needed, everything is AndroidX already).
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

kotlin.code.style=official
